# On every push to master and pull request: HalkoCore's tests, then the Xcode project generated from project.yml,
# the iPhone app (with the watch app inside) built and its interface tested on a simulator. The screenshots of the
# interface tests are kept with the run. A change to the documentation only skips them. A pull request runs only the
# interface tests of the screens it changes (.github/ui-tests.sh); master, after the merge, runs them all.
# "CI passed" sums it up: it is the check a pull request needs to be merged into master.
name: CI

on:
  push:
    branches: [master]
  pull_request:

# A new push to a pull request stops the run of the one before: only the last is checked. Every merge into master is
# checked to the end.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.diff.outputs.code }}
      ui-tests: ${{ steps.diff.outputs.ui-tests }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # Anything but Markdown, docs/, LICENSE and NOTICE (everything when the base is unknown: a new branch).
          if git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            files=$(git diff --name-only "$BASE" "$GITHUB_SHA")
          else
            files=everything
          fi
          code=$(echo "$files" | grep -Ev '\.md$|^docs/|^LICENSE$|^NOTICE$' | head -1)
          echo "code=$([ -n "$code" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          # The interface tests: those of the screens changed on a pull request, all on master.
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            ui=$(echo "$files" | bash .github/ui-tests.sh | xargs)
          else
            ui=all
          fi
          echo "Interface tests: ${ui:-none}"
          echo "ui-tests=$ui" >> "$GITHUB_OUTPUT"

  core:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - run: xcodebuild -version
      - run: swift test --package-path Packages/HalkoCore -Xswiftc -warnings-as-errors

  apps:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Pick an iPhone simulator
        id: simulator
        run: |
          # The newest iOS runtime of this Xcode, and its first iPhone.
          id=$(xcrun simctl list devices available --json | jq -r '
            .devices | to_entries | map(select(.key | contains("iOS"))) | sort_by(.key | sub(".*iOS-"; "") | split("-") | map(tonumber))
            | last.value | map(select(.name | startswith("iPhone"))) | first.udid')
          xcrun simctl list devices | grep "$id"
          echo "id=$id" >> "$GITHUB_OUTPUT"
      - name: Build the watch app
        run: xcodebuild build -project Halko.xcodeproj -scheme HalkoWatch -destination 'generic/platform=watchOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO
      - name: Test the iPhone app
        # A test failing on a slow runner (an audit or a query out of time) is run again, alone, up to twice: only a
        # failure that comes back three times fails the job. Without a screen changed, the app is only built.
        env:
          TESTS: ${{ needs.changes.outputs.ui-tests }}
          SIMULATOR: ${{ steps.simulator.outputs.id }}
        run: |
          if [ -z "$TESTS" ]; then
            xcodebuild build -project Halko.xcodeproj -scheme Halko -destination "id=$SIMULATOR" -derivedDataPath build
            exit
          fi
          only=()
          if [ "$TESTS" != all ]; then
            for test in $TESTS; do
              only+=("-only-testing:HalkoUITests/$test")
            done
          fi
          xcodebuild test -project Halko.xcodeproj -scheme Halko -destination "id=$SIMULATOR" -derivedDataPath build -resultBundlePath Halko.xcresult -retry-tests-on-failure -test-iterations 3 ${only[@]+"${only[@]}"}
      - name: Check the watch app is inside the iPhone app, and both have their icon
        run: |
          app=build/Build/Products/Debug-iphonesimulator/Halko.app
          test -d "$app/Watch/HalkoWatch.app"
          # A missing or unreadable icon does not fail the build: the icon name is then absent from Info.plist.
          for plist in "$app/Info.plist" "$app/Watch/HalkoWatch.app/Info.plist"; do
            test "$(plutil -extract CFBundleIcons.CFBundlePrimaryIcon.CFBundleIconName raw "$plist" 2>/dev/null || plutil -extract CFBundleIconName raw "$plist")" = AppIcon
          done
      - name: Check the iPhone app holds every picture of the exercise library, and no other
        run: |
          app=build/Build/Products/Debug-iphonesimulator/Halko.app
          diff <(jq -r '.[].mediaIds[] + ".webp"' Packages/HalkoCore/Sources/HalkoCore/Resources/exercises.json | sort -u) <(ls "$app/ExerciseImages" | sort)
      - name: Export the screenshots
        if: always() && hashFiles('Halko.xcresult/**') != ''
        run: xcrun xcresulttool export attachments --path Halko.xcresult --output-path screenshots
      - uses: actions/upload-artifact@v7
        if: always() && hashFiles('Halko.xcresult/**') != ''
        with:
          name: screenshots
          path: screenshots
          if-no-files-found: ignore
      # The whole test report (the app's output, its crash and hang logs) when a test fails.
      - uses: actions/upload-artifact@v7
        if: failure() && hashFiles('Halko.xcresult/**') != ''
        with:
          name: xcresult
          path: Halko.xcresult

  passed:
    name: CI passed
    needs: [changes, core, apps]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Every job passed or was not needed
        run: |
          echo "changes: ${{ needs.changes.result }}, core: ${{ needs.core.result }}, apps: ${{ needs.apps.result }}"
          [[ "${{ needs.changes.result }}" == success ]]
          [[ "${{ needs.core.result }}" =~ ^(success|skipped)$ && "${{ needs.apps.result }}" =~ ^(success|skipped)$ ]]
