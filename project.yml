# XcodeGen description of the Xcode project: `xcodegen generate` makes Halko.xcodeproj, which is never committed.
name: Halko

options:
  bundleIdPrefix: com.zsr
  developmentLanguage: en
  deploymentTarget:
    iOS: "26.0"
    watchOS: "26.0"

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    GENERATE_INFOPLIST_FILE: YES

packages:
  HalkoCore:
    path: Packages/HalkoCore

targets:
  Halko:
    type: application
    platform: iOS
    sources:
      - Halko
      # Shared with the widgets: what the session's Live Activity holds, and its buttons.
      - Shared
      - path: AppIcon.icon
        type: file
        buildPhase: resources
      # Pictures of the embedded exercise library (HalkoCore's exercises.json), named by media id.
      - path: ExerciseImages
        type: folder
        buildPhase: resources
    dependencies:
      - package: HalkoCore
      - target: HalkoWatch
      - target: HalkoWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zsr.halko
        # Merged with the generated keys: the end of a rest heard in the background (UIBackgroundModes audio).
        INFOPLIST_FILE: Halko/Info.plist
        # Health, and the end of a rest notified even in a Focus.
        CODE_SIGN_ENTITLEMENTS: Halko/Halko.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Color(.musclePrimary)…: the colors of Assets.xcassets, checked by the compiler.
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_CFBundleDisplayName: Halko
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.healthcare-fitness
        # The session in progress on the lock screen and in the Dynamic Island.
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        # Translated in InfoPlist.xcstrings.
        INFOPLIST_KEY_NSHealthShareUsageDescription: Halko reads your heart rate and active calories during a workout to show them, and today's Activity rings in the workout summary.
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: Halko saves your strength workouts in Health, with their active calories and heart rate, so that they count towards your Move and Exercise rings.
        # Only standard encryption (HTTPS): no export compliance question on each TestFlight build.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight

  # The session in progress outside the app (Live Activity), drawn from what the iPhone app writes; its buttons run in
  # the app.
  HalkoWidgets:
    type: app-extension
    platform: iOS
    sources:
      - HalkoWidgets
      - Shared
      # The app's colours.
      - path: Halko/Assets.xcassets
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zsr.halko.widgets
        INFOPLIST_FILE: HalkoWidgets/Info.plist
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_CFBundleDisplayName: Halko
        SKIP_INSTALL: YES

  # Installed with the iPhone app, which sets it up; then it works on its own.
  HalkoWatch:
    type: application
    platform: watchOS
    sources:
      - HalkoWatch
      - path: AppIcon.icon
        type: file
        buildPhase: resources
    dependencies:
      - package: HalkoCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zsr.halko.watchkitapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "4"
        INFOPLIST_KEY_CFBundleDisplayName: Halko
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.zsr.halko
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: NO

  HalkoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [HalkoUITests]
    dependencies:
      - target: Halko
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zsr.halko.uitests
        # XCTestCase is not isolated: only the tests themselves run on the main actor.
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
        TARGETED_DEVICE_FAMILY: "1"
        TEST_TARGET_NAME: Halko

schemes:
  Halko:
    build:
      targets:
        Halko: all
    test:
      targets: [HalkoUITests]
  HalkoWatch:
    build:
      targets:
        HalkoWatch: all
